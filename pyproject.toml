[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "veriq"
version = "0.1.0a4"
description = "Bounded, evidence-backed static checks for exported n8n workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
sop = ["PyMuPDF>=1.26,<2", "python-docx>=1.2,<2"]
mcp = ["mcp>=1.30,<2"]
hosted = ["mcp>=1.30,<2", "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1", "uvicorn>=0.30,<1", "PyMuPDF>=1.26,<2", "python-docx>=1.2,<2"]
appwrite = ["mcp>=1.30,<2", "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1", "PyMuPDF>=1.26,<2", "python-docx>=1.2,<2"]

[project.scripts]
veriq = "veriq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veriq = ["web/*.html", "web/*.css", "web/*.js", "web/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

