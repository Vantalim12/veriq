name: Security scans

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan Git history for secrets
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts="--all" \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json" .
          status=$?
          set -e
          if [ -f "$RUNNER_TEMP/gitleaks-report.json" ]; then
            python - "$RUNNER_TEMP/gitleaks-report.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report:
              findings = json.load(report)
          for finding in findings:
              print("Redacted Gitleaks finding: " + json.dumps({
                  "rule": finding.get("RuleID"),
                  "file": finding.get("File"),
                  "commit": finding.get("Commit"),
                  "fingerprint": finding.get("Fingerprint"),
                  "line": finding.get("StartLine"),
                  "description": finding.get("Description"),
              }, ensure_ascii=False))
          PY
          fi
          exit "$status"

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install isolated vulnerability scanner
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install pip-audit==2.10.1
      - name: Audit pinned Python dependencies
        run: '"$RUNNER_TEMP/pip-audit/bin/python" -m pip_audit --strict --no-deps --disable-pip -r constraints.txt'
