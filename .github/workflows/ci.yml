name: Core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install tested dependencies and local package
        run: python -m pip install -c constraints.txt '.[test,hosted,appwrite]'
      - name: Run labeled, security, and CLI tests
        run: python -m pytest -q


  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate deployment configuration
        run: docker compose --env-file deployment/.env.example -f deployment/compose.yaml config -q
      - name: Build hosted image
        run: docker build --tag veriq:test .
      - name: Check installed entrypoint
        run: docker run --rm --entrypoint veriq veriq:test --version
